name: Build BandSync APK

# 手动触发为主：点 Actions → Build BandSync APK → Run workflow
# 也可以 push 到 main/master 自动触发
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # 本工程缺 gradle-wrapper.jar，不依赖 wrapper；删除 wrapper 目录避免校验报错
      - name: Remove incomplete wrapper
        run: rm -rf gradle/wrapper

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 云端装 Gradle 8.2 并加入 PATH（AGP 8.1.4 的兼容版本），直接跑 gradle 命令
      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
          validate-wrappers: false

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bandsync-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
